<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_popup.css"> 
</head>
    <body>
        <header>
            <div class="titulos">
                <p> <span class="colorTitulos">Go</span>od <span class="colorTitulos">V</span>ibes <span class="colorTitulos">O</span>nly</p> 
            </div>
        </header>

        <div id="main-div">
            <!-- activador de la extension  -->
            <div id="titulo-filtro" class="titles" for="activador">Filtros de palabras</div>

            <!-- Toggle para activar el filtro -->
            <div class="checkbox-wrapper-22" id="div-toggle-filtro">
                <label for="activador" class="switch2">
                    <input type="checkbox" name="activador" id="activador"/>
                    <div class="slider round"></div>
                </label>
            </div>

            <!-- Opciones del filtro -->
            <div id="opciones-filtro" >
                
                <!-- Palabras Altisonantes -->

                <div id="div-checkbox-altisonantes" class="checkbox-wrapper-22">

                    <label for="altisonantes" class="label-filtro">Palabras Altisonantes </label>

                    <label id="lbl-altisonantes" class="switch2" for="altisonantes" >

                        <input type="checkbox" name="altisonantes" id="altisonantes" disabled> 
                        <div class="slider round"></div>

                    </label>
                    
                </div>

                <!-- Palabras Racistas -->

                <div id="div-checkbox-racistas" class="checkbox-wrapper-22"> 

                    <label for="racistas" class="label-filtro">Comentarios Racistas</label>

                    <label id="lbl-racistas" class="switch2" for="racistas" > 

                        <input type="checkbox" name="racistas" id="racistas" disabled>
                        <div class="slider round"></div>

                    </label>
                    
                </div>

                <!-- Palabras sexistas -->

                <div id="div-checkbox-sexistas" class="checkbox-wrapper-22">

                    <label for="sexistas" class="label-filtro">Comentarios Sexistas</label>

                   <label id="lbl-sexistas" class="switch2" for="sexistas" >

                        <input type="checkbox" name="sexistas" id="sexistas" disabled> 
                        <div class="slider round"></div>

                    </label>
                    
                </div>

            </div>

            <!-- Tipos de filtro -->

            <div id="tipoFiltro">

                <div id="lbl-tipoFiltro" class="titles">
                    <label>Tipos de Filtro</label>
                </div>

                <div id="div-tiposFiltro">
                    <input type="button" value="Censurado (*)" id="btn-Censura" name="btn-Censura" class="botones" disabled>
                    <input type="button" value="Eliminada" id="btn-Eliminada" name="btn-Eliminada" class="botones" disabled>
                </div>

            </div>

        </div>
        <p class="copy">© 2024 Cerateam</p>
    </body>
    <script src="popup.js"></script>
</html>
