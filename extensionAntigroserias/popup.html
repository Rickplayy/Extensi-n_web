<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_popup.css"> 
</head>
    <body>
        <script src="popup.js"></script>

        <header>
            <div class="titulos">
                <p>Extension Anti-Groserias</p> 
            </div>
        </header>

        <div id="main-div">

            <div id="titulo-filtro">Filtros de palabras</div>
            <!-- Toggle para activar el filtro -->
            <div class="wrap-toggle" id="div-toggle-filtro">
                <input type="checkbox" name="toggle" id="toggle" class="offscreen">
                <label for="toggle" class="switch"></label>
            </div>

            <!-- div con opciones del filtro -->
            <div id="opciones-filtro" >
                
                <div id="div-checkbox-altisonantes" class="grupo-input">
                    <input type="checkbox" class="inputs" name="altisonantes" id="altisonantes"> 
                    <label id="lbl-altisonantes" class="labels" for="altisonantes"> Palabras Altisonantes </label>
                </div>

                <div id="div-checkbox-racistas" class="grupo-input">
                    <input type="checkbox" class="inputs" name="racistas" id="racistas"> 
                    <label id="lbl-racistas" class="labels" for="racistas"> Comentarios Racistas </label>
                </div>

                <div id="div-checkbox-sexistas" class="grupo-input">
                    <input type="checkbox" class="inputs" name="sexistas" id="sexistas"> 
                    <label id="lbl-sexistas" class="labels" for="sexistas"> Comentarios Sexistas </label>
                </div>

            </div>

            <div id="tipoFiltro">

                <div id="lbl-tipoFiltro">
                    <label>Tipos de Filtro</label>
                </div>

                <div id="div-tiposFiltro">
                    <input type="button" value="Censurado (*)" id="btn-Censura" name="btn-Censura" class="botones-filtro">
                    <input type="button" value="Eliminada" id="btn-Eliminada" name="btn-Eliminada" class="botones-filtro">
                </div>

            </div>

            <!-- Div de tolerancia -->
            <div id="div-tolerancia">
                <div id="lbl-tolerancia">
                    <label>Tolerancia</label>
                </div>

                <div id="rd-tolerancia" class="div-forms">
                    <input type="radio" name="tolerancia" id="rd-baja" value="baja" class="inputs">
                    <label class="labels" for="rd-baja">baja</label>

                    <input type="radio" name="tolerancia" id="rd-media" value="media" class="inputs">
                    <label class="labels" for="rd-media">media</label>

                    <input type="radio" name="tolerancia" id="rd-alta" value="alta" class="inputs">
                    <label class="labels" for="rd-alta">alta</label>
                </div>
            </div>
        </div>
    </body>
</html>
