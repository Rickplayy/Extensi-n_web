<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_popup.css"> 
</head>
    <body>
        <script src="popup.js"></script>

        <header>
            <div class="titulos">
                <p> <span class="colorTitulos">Go</span>od <span class="colorTitulos">V</span>ibes <span class="colorTitulos">O</span>nly</p> 
            </div>
        </header>

        <div id="main-div">

            <div id="titulo-filtro" class="titles" for="activador">Filtros de palabras</div>
            <!-- Toggle para activar el filtro -->
            <div class="checkbox-wrapper-22" id="div-toggle-filtro">
                <label for="activador" class="switch2">
                    <input type="checkbox" name="activador" id="activador"/>
                    <div class="slider round"></div>
                </label>
            </div>

            <!-- div con opciones del filtro -->
            <div id="opciones-filtro" >
                
                <div id="div-checkbox-altisonantes" class="checkbox-wrapper-22">

                    <label for="altisonantes" class="label-filtro">Palabras Altisonantes </label>

                    <label id="lbl-altisonantes" class="switch2" for="altisonantes" >

                        <input type="checkbox" name="altisonantes" id="altisonantes"> 
                        <div class="slider round"></div>

                    </label>
                    
                </div>

                <div id="div-checkbox-racistas" class="checkbox-wrapper-22"> 

                    <label for="racistas" class="label-filtro">Comentarios Racistas</label>

                    <label id="lbl-racistas" class="switch2" for="racistas" > 

                        <input type="checkbox" name="racistas" id="racistas">
                        <div class="slider round"></div>

                    </label>
                    
                </div>

                <div id="div-checkbox-sexistas" class="checkbox-wrapper-22">

                    <label for="sexistas" class="label-filtro">Comentarios Sexistas</label>

                   <label id="lbl-sexistas" class="switch2" for="sexistas" >

                        <input type="checkbox" name="sexistas" id="sexistas"> 
                        <div class="slider round"></div>

                    </label>
                    
                </div>

            </div>

            <div id="tipoFiltro">

                <div id="lbl-tipoFiltro" class="titles">
                    <label>Tipos de Filtro</label>
                </div>

                <div id="div-tiposFiltro">
                    <input type="button" value="Censurado (*)" id="btn-Censura" name="btn-Censura" class="botones">
                    <input type="button" value="Eliminada" id="btn-Eliminada" name="btn-Eliminada" class="botones">
                </div>

            </div>

            <!-- Div de tolerancia -->
            <div id="div-tolerancia">
                <div id="lbl-tolerancia" class="titles">
                    <label>Tolerancia</label>
                </div>

                <div id="rd-tolerancia" class="wrap">
                   
                    <input type="radio" name="tolerancia" id="rd-baja" value="baja" class="inputs" checked>
                    <label class="labels" for="rd-baja">Baja</label>
                    
                    <input type="radio" name="tolerancia" id="rd-media" value="media" class="inputs">
                    <label class="labels" for="rd-media">Media</label>

                    <input type="radio" name="tolerancia" id="rd-alta" value="alta" class="inputs">
                    <label class="labels" for="rd-alta">Alta</label>

                </div>
            </div>
        </div>
    </body>
</html>
